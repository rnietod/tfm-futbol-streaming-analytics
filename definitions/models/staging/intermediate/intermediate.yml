version: 2

models:
  - name: int_game_state
    description: "Lógica intermedia para calcular el marcador en tiempo real."
    columns:
      - name: match_id
        description: "FK. ID del partido."
      - name: event_id
        description: "PK. ID del evento."
      - name: game_state_label
        description: "Estado del marcador desde la perspectiva del equipo que realiza el evento: 'Winning', 'Losing', 'Drawing'."

  - name: int_match_metadata
    description: "Tabla intermedia que calcula la duración y metadatos temporales de cada partido."
    columns:
      - name: match_id
        description: "Identificador único del partido (FK)."
      - name: minutes_played_global
        description: "Duración total del partido calculada desde el primer evento hasta el último."
      - name: effective_minutes
        description: "Minutos de tiempo efectivo de juego. Actualmente calculado igual al global, pendiente de integración con fuente externa."
