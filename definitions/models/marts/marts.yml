version: 2

models:
  - name: fct_events_enriched
    description: "Tabla maestra de eventos con más de 180 métricas pivotadas, contexto táctico y estado del partido."
    columns:
      - name: event_id
        description: "PK. ID único del evento."
      - name: game_state_label
        description: "Estado del marcador (Winning, Losing, Drawing)."
      - name: is_big_chance
        description: "Flag. Ocasión manifiesta de gol."
      - name: pass_end_x
        description: "Coordenada X final del pase."
      - name: field_zone
        description: "Zona del campo (Right, Left, Center, Back)."

  - name: fct_player_season_stats
    description: "Tabla agregada de rendimiento histórico por jugador y temporada. Normalizada a 90 minutos de tiempo efectivo. Sirve como Baseline."
    columns:
      - name: player_id
        description: "Identificador único del jugador."
      - name: player_name
        description: "Nombre del jugador."
      - name: season
        description: "Temporada analizada."
      - name: league
        description: "Liga donde jugó."
      - name: matches_analyzed
        description: "Cantidad de partidos computados para este perfil."
      - name: avg_minutes_played
        description: "Promedio de minutos jugados por partido."
      - name: avg_goals_p90
        description: "Promedio de goles por 90 min."
      - name: std_goals_p90
        description: "Desviación estándar de goles."
      - name: avg_shots_p90
        description: "Promedio de tiros totales por 90 min."
      - name: std_shots_p90
        description: "Desviación estándar de tiros."
      - name: avg_key_passes_p90
        description: "Promedio de pases clave por 90 min."
      - name: std_key_passes_p90
        description: "Desviación estándar de pases clave."
      - name: avg_dribbles_p90
        description: "Promedio de regates completados por 90 min."
      - name: std_dribbles_p90
        description: "Desviación estándar de regates."
      - name: avg_recoveries_p90
        description: "Promedio de recuperaciones de balón por 90 min."
      - name: std_recoveries_p90
        description: "Desviación estándar de recuperaciones."
      - name: avg_tackles_p90
        description: "Promedio de entradas ganadas por 90 min."
      - name: std_tackles_p90
        description: "Desviación estándar de entradas ganadas."
      - name: avg_interceptions_p90
        description: "Promedio de intercepciones por 90 min."
      - name: std_interceptions_p90
        description: "Desviación estándar de intercepciones."
      - name: avg_actions_p90
        description: "Promedio de acciones totales (volumen de juego) por 90 min."
      - name: std_actions_p90
        description: "Desviación estándar de volumen de juego."
      - name: avg_pass_accuracy
        description: "Promedio del porcentaje de acierto en el pase."
      - name: std_pass_accuracy
        description: "Desviación estándar del acierto en el pase."

  - name: fct_player_season_stats_advanced
    description: "Tabla avanzada de rendimiento segmentada por Contexto de Partido (Game State)."
    columns:
      - name: player_id
        description: "ID único del jugador."
      - name: player_name
        description: "Nombre del jugador."
      - name: team_id
        description: "ID del equipo."
      - name: season
        description: "Temporada."
      - name: league
        description: "Liga."
      - name: game_state_label
        description: "Contexto del marcador: 'Winning', 'Losing', 'Drawing'."
      - name: matches_played
        description: "Partidos jugados en este contexto."
      - name: goals
        description: "Goles anotados en este contexto."
      - name: shots_total
        description: "Tiros totales en este contexto."
      - name: shots_on_target
        description: "Tiros a puerta en este contexto."
      - name: passes_total
        description: "Pases totales en este contexto."
      - name: passes_complete
        description: "Pases completados en este contexto."
      - name: conversion_rate
        description: "Ratio de conversión (Goles / Tiros)."
      - name: shooting_accuracy
        description: "Puntería (Tiros a Puerta / Tiros Totales)."
      - name: pass_accuracy
        description: "Precisión de pase."
      - name: share_of_team_goals
        description: "Porcentaje de los goles del equipo anotados por este jugador."
      - name: share_of_team_shots
        description: "Porcentaje de los tiros totales del equipo realizados por este jugador."
      - name: share_of_team_passes
        description: "Porcentaje de los pases totales del equipo realizados por este jugador."